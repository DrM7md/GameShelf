[package]
name = "gameshelf"
version = "0.1.0"
edition = "2021"
description = "A game library that launches your emulators"

[dependencies]
eframe = "0.31"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
ureq = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 3
